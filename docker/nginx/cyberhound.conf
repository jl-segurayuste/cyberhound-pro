# CyberHound Pro — Configuración Nginx para producción
# Rate limiting
limit_req_zone $binary_remote_addr zone=cyberhound_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cyberhound_login:10m rate=5r/m;

# Upstream CyberHound (HTTPS interno)
upstream cyberhound_backend {
    server cyberhound:8443;
    keepalive 32;
}

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name ${CH_DOMAIN:-localhost};

    # Certificados (auto-firmados o Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # TLS moderno
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ocultar versión nginx
    server_tokens off;

    # Rate limiting en login
    location /login {
        limit_req zone=cyberhound_login burst=3 nodelay;
        proxy_pass https://cyberhound_backend;
        proxy_ssl_verify off;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Rate limiting en API
    location /api/ {
        limit_req zone=cyberhound_api burst=50 nodelay;
        proxy_pass https://cyberhound_backend;
        proxy_ssl_verify off;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # WebSocket
    location /ws {
        proxy_pass https://cyberhound_backend;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Todo lo demás
    location / {
        proxy_pass https://cyberhound_backend;
        proxy_ssl_verify off;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
