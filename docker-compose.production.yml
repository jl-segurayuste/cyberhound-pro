# CyberHound Pro — despliegue de producción: app + PostgreSQL + nginx (TLS) + copias diarias
#
#   cp .env.example .env      # define al menos CH_PASSWORD y POSTGRES_PASSWORD
#   docker compose -f docker-compose.production.yml up -d
#
# Certificado: si no hay ./docker/nginx/certs/{cert,key}.pem se genera uno autofirmado
# en el volumen nginx_certs. Para uno propio (Let's Encrypt…) sustituye esos dos ficheros.

x-image: &image
  image: ${CYBERHOUND_IMAGE:-ghcr.io/jl-segurayuste/cyberhound-pro:latest}
  build: .

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberhound
      POSTGRES_USER: cyberhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberhound -d cyberhound"]
      interval: 10s
      timeout: 5s
      retries: 10

  cyberhound:
    <<: *image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CH_USERNAME: ${CH_USERNAME:-admin}
      CH_PASSWORD: ${CH_PASSWORD:?define CH_PASSWORD en .env}
      CH_DB_URL: postgresql://cyberhound:${POSTGRES_PASSWORD}@postgres:5432/cyberhound
      CH_HOST: 0.0.0.0                       # solo accesible por nginx en la red interna
      CH_TRUSTED_PROXIES: 172.30.57.0/24     # nginx: el rate limit ve la IP real del cliente
      CH_TLS_DIR: /data/tls
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      GREYNOISE_KEY: ${GREYNOISE_KEY:-}
      OTX_KEY: ${OTX_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      CH_SMTP_PASSWORD: ${CH_SMTP_PASSWORD:-}
      CH_AGENT_KEY: ${CH_AGENT_KEY:-}
    volumes:
      - cyberhound_data:/data
      # Para el análisis de contenedores, descomenta:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [internal, egress]             # egress: feeds de CVEs, threat intel, nuclei
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Genera el certificado autofirmado de nginx la primera vez (y se apaga)
  certs:
    <<: *image
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - |
        import shutil, os
        from pathlib import Path
        dst = Path("/certs"); own = Path("/own")
        if (own / "cert.pem").exists() and (own / "key.pem").exists():
            for f in ("cert.pem", "key.pem"):
                shutil.copy(own / f, dst / f)
            print("certificado propio copiado")
        elif not (dst / "cert.pem").exists():
            os.environ["CH_TLS_DIR"] = "/certs"
            from cyberhound.core.security import TLSManager
            TLSManager.CERT_DIR = dst
            TLSManager.generate_self_signed(common_name=os.environ.get("CH_DOMAIN") or "localhost")
            print("certificado autofirmado generado")
    environment:
      CH_DOMAIN: ${CH_DOMAIN:-localhost}
    volumes:
      - nginx_certs:/certs
      - ./docker/nginx/certs:/own:ro
    network_mode: none

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cyberhound:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    environment:
      CH_DOMAIN: ${CH_DOMAIN:-localhost}
    ports:
      - "${CH_HTTP_PORT:-80}:80"
      - "${CH_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - nginx_certs:/etc/nginx/certs:ro
    networks:
      internal:
        ipv4_address: 172.30.57.10
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    networks: [internal]
    # Copia al arrancar y luego cada 24 h (se conservan las 30 últimas)
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  postgres_data:
  cyberhound_data:
  nginx_certs:
  backups:

networks:
  internal:
    internal: true                           # PostgreSQL sin salida ni exposición
    ipam:
      config:
        - subnet: 172.30.57.0/24
  egress: {}
