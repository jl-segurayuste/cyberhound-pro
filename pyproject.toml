[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhound-pro"
version = "6.1.0"
description = "Plataforma de auditoría y seguridad para PYMEs"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "pyyaml>=6.0",
    "PyJWT>=2.8",
    "cryptography>=41.0",
    "asyncssh>=2.14",
    "tenacity>=8.0",
    "colorama>=0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
]

[project.scripts]
cyberhound = "cyberhound.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberhound*"]

[tool.setuptools.package-data]
"cyberhound.ui.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
addopts = ["-v", "--tb=short", "--no-header"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["cyberhound"]
omit = ["tests/*", "cyberhound/ui/*"]
