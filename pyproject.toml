[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhound-pro"
version = "6.1.0"
description = "Plataforma de auditoría y seguridad para PYMEs"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "pyyaml>=6.0",
    "PyJWT>=2.8",
    "cryptography>=41.0",
    "asyncssh>=2.14",
    "tenacity>=8.0",
    "colorama>=0.4",
    "jinja2>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
]
dev = [
    "ruff>=0.6",
]

[project.scripts]
cyberhound = "cyberhound.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberhound*"]

[tool.setuptools.package-data]
"cyberhound.ui.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
addopts = ["-v", "--tb=short", "--no-header"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["cyberhound"]
omit = ["tests/*", "cyberhound/ui/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E701",   # multiple statements on one line (estilo compacto intencional)
    "E741",   # ambiguous variable names (l, I) en contextos matemáticos
    "E402",   # module import not at top (lazy imports intencionales)
    "E501",   # line too long (gestionado por line-length)
    "B008",   # function call in default argument (patrón aiohttp/fastapi)
]

[tool.ruff.lint.per-file-ignores]
"cyberhound/core/scheduler.py" = ["F401"]   # find_spec availability check pattern
"tests/*" = ["F811", "F401"]
