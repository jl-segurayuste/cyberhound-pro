# CyberHound Pro — un solo contenedor con SQLite (homelab / PYME pequeña)
#
#   cp .env.example .env     # opcional: CH_PASSWORD, API keys…
#   docker compose up -d
#   docker compose logs cyberhound | grep -i contraseña   # si no definiste CH_PASSWORD
#
# Abre https://localhost:8443 (certificado autofirmado). Con network_mode: host el
# panel escucha en 127.0.0.1 del host; CH_HOST=0.0.0.0 lo expone a la red local.
# Para PostgreSQL + nginx usa docker-compose.production.yml.

services:
  cyberhound:
    image: ${CYBERHOUND_IMAGE:-ghcr.io/jl-segurayuste/cyberhound-pro:latest}
    build: .                 # docker compose build: imagen local con el código del repo
    container_name: cyberhound
    restart: unless-stopped

    # Red del host: necesario para descubrir la LAN (nmap, arp-scan) desde el contenedor
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      CH_USERNAME: ${CH_USERNAME:-admin}
      CH_PASSWORD: ${CH_PASSWORD:-}        # vacía = se genera una y se muestra en el log
      CH_HOST: ${CH_HOST:-127.0.0.1}
      CH_PORT: ${CH_PORT:-8443}
      CH_TLS_DIR: /data/tls
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      GREYNOISE_KEY: ${GREYNOISE_KEY:-}
      OTX_KEY: ${OTX_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}

    volumes:
      - cyberhound-data:/data              # config.yaml, BD, logs y certificado
      - ${HOME}/.ssh:/root/.ssh:ro         # claves para la auditoría SSH de otros hosts
      # Análisis de contenedores Docker (opcional):
      # - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:$${CH_PORT:-8443}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  cyberhound-data:
