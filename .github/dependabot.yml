version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Solo mueve las versiones fijadas (==); no sube los mínimos (>=) sin necesidad.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
