name: CI — Test & Build

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cyberhound-pro

jobs:
  # ── Linting (ruff) ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ruff y mypy
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check cyberhound/ tests/
      - name: Mypy type-check (informativo)
        run: mypy cyberhound/ || true

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y --no-install-recommends nmap shellcheck

      - name: Instalar paquete y dependencias de test
        run: pip install -e ".[test]"

      - name: Verificar importaciones
        run: |
          python -c "from cyberhound.core.security import RateLimiter, InputValidator, TLSManager"
          python -c "from cyberhound.core.database import Database"
          python -c "from cyberhound.core.scheduler import Scheduler"
          python -c "from cyberhound.api.server import CyberHoundServer"
          echo "✓ Todos los imports OK"

      - name: Ejecutar tests con cobertura
        run: |
          pytest tests/ -v \
            --tb=short \
            --timeout=30 \
            --cov=cyberhound \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload cobertura a Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Misma suite contra PostgreSQL ───────────────────────────────────────────
  test-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ch
          POSTGRES_PASSWORD: ch-ci
          POSTGRES_DB: ch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ch -d ch" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y --no-install-recommends nmap shellcheck
      - name: Instalar paquete con soporte PostgreSQL
        run: pip install -e ".[test,postgres]"
      - name: Ejecutar tests contra PostgreSQL
        env:
          CH_DB_URL: postgresql://ch:ch-ci@127.0.0.1:5432/ch
        run: pytest tests/ --tb=short --timeout=60 -q

  # ── Análisis de seguridad estático ─────────────────────────────────────────
  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas
        run: pip install bandit semgrep

      - name: Bandit (Python security linter)
        run: |
          bandit -r cyberhound/ \
            -x cyberhound/ui/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt || true

      - name: Verificar sintaxis de todos los módulos Python
        run: |
          shopt -s globstar
          python -m py_compile cyberhound/**/*.py cyberhound/*.py

      - name: Verificar que no hay secretos hardcodeados
        run: |
          # Buscar patrones de secretos obvios
          ! grep -rn \
            -e "password\s*=\s*['\"][^'\"]{8,}" \
            -e "api_key\s*=\s*['\"][^'\"]{10,}" \
            -e "secret\s*=\s*['\"][^'\"]{10,}" \
            cyberhound/ --include="*.py" \
            --exclude-dir=__pycache__ || echo "Revisión manual recomendada"

  # ── Build Docker ────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [test, test-postgres, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push imagen multi-arch
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # ── Procedencia SLSA de la imagen Docker ────────────────────────────────────
  # Solo en tags de version (misma condicion que "release"): genera y firma
  # (via Sigstore/cosign keyless) un attestation SLSA v3 ligado al digest real
  # de la imagen ya publicada en GHCR, verificable con:
  #   cosign verify-attestation --type slsaprovenance \
  #     --certificate-identity-regexp ".*" \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     ghcr.io/jl-segurayuste/cyberhound-pro@<digest>
  provenance:
    name: Procedencia SLSA
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.docker.outputs.image }}
      digest: ${{ needs.docker.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Release automático ──────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notas de la versión (sección del CHANGELOG)
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # La sección "## [X.Y.Z]" de CHANGELOG.md; si no está, los commits desde la etiqueta anterior
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG:+$PREV_TAG..}HEAD)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.changelog.outputs.notes }}

            ### Instalación rápida
            ```bash
            docker run -d --network host --cap-add NET_ADMIN --cap-add NET_RAW \
              -e CH_PASSWORD=mi_contraseña \
              -v cyberhound-data:/data \
              ghcr.io/jl-segurayuste/cyberhound-pro:${{ steps.changelog.outputs.version }}
            ```
          draft: false
          prerelease: false
